services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: scan
      POSTGRES_PASSWORD: scan
      POSTGRES_DB: scan
    ports: ['5433:5432']
    volumes: [scan_data:/var/lib/postgresql/data]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U scan']
      interval: 2s
      retries: 15
  app:
    build: .
    ports: ['8080:8080']
    environment:
      DATABASE_URL: postgres://scan:scan@db:5432/scan
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5-mini}
      TYPESAFE_API_KEY: ${TYPESAFE_API_KEY:-}
      TYPESAFE_MODEL: ${TYPESAFE_MODEL:-jev-1.13.0}
      WORKER_SLOTS: ${WORKER_SLOTS:-4}
    depends_on:
      db: { condition: service_healthy }
volumes:
  scan_data:
